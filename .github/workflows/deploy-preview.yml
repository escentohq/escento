name: Deploy Preview (Vercel)

# Runs on pull requests and on pushes to any branch except `main`. Produces a
# Vercel preview deployment with its own URL, authenticated as the project owner
# via VERCEL_TOKEN so the Hobby "commit author" block does not apply.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The project is identified by VERCEL_ORG_ID + VERCEL_PROJECT_ID (job env),
      # and the build runs on Vercel — so Preview env vars and system env vars are
      # injected automatically from the project settings, exactly like a native
      # Git deploy. The owner's VERCEL_TOKEN still bypasses the Hobby "commit
      # author" block regardless of who pushed.
      - name: Deploy to Vercel (preview)
        run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }}

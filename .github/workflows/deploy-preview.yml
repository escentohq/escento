name: Deploy Preview (Vercel)

# Runs on pull requests and on pushes to any branch except `main`. Produces a
# Vercel preview deployment with its own URL, authenticated as the project owner
# via VERCEL_TOKEN so the Hobby "commit author" block does not apply.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull retrieves the project's env vars into .vercel/.env.preview.local.
      # Build-time vars (NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY)
      # must be NON-sensitive in Vercel so their values come through — sensitive
      # vars pull as empty strings and crash the prerender build.
      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Build locally, then upload the prebuilt output. A --prebuilt deploy is
      # attributed to the TOKEN OWNER (not the commit author), which is what
      # bypasses the Hobby plan's "commit author did not have contributing
      # access" block. Building on Vercel (vercel deploy without --prebuilt)
      # would re-trigger that block.
      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

name: Secret scan

# SUPABASE_SERVICE_ROLE_KEY and RESEND_API_KEY are both in play in local .env
# files, which makes a pasted key one careless `git add -A` away from the diff.
# A leaked service-role key bypasses every server-side check the app has.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret committed earlier in the branch and removed in
          # a later commit is still in the objects that get pushed.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks detect --redact --no-banner --verbose

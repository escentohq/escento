name: Deploy to Production (Vercel)

# Runs automatically on every push to `main`. Authenticates to Vercel as the
# project owner via the VERCEL_TOKEN secret, so deploys are NOT blocked by the
# Hobby plan's "commit author" restriction regardless of who pushed the commit.
on:
  push:
    branches: [main]

# If several commits land quickly, cancel superseded in-flight production
# deploys so only the latest commit goes live.
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The project is identified by VERCEL_ORG_ID + VERCEL_PROJECT_ID (job env),
      # and the build runs on Vercel — so Production env vars (Supabase keys, etc.)
      # and system env vars are injected automatically from the project settings,
      # exactly like a native Git deploy. The owner's VERCEL_TOKEN still bypasses
      # the Hobby "commit author" block regardless of who pushed.
      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

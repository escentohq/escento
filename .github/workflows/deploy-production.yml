name: Deploy to Production (Vercel)

# Runs automatically on every push to `main`. Authenticates to Vercel as the
# project owner via the VERCEL_TOKEN secret, so deploys are NOT blocked by the
# Hobby plan's "commit author" restriction regardless of who pushed the commit.
on:
  push:
    branches: [main]

# If several commits land quickly, cancel superseded in-flight production
# deploys so only the latest commit goes live.
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull retrieves the project's env vars into .vercel/.env.production.local.
      # Build-time vars (NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY)
      # must be NON-sensitive in Vercel so their values come through — sensitive
      # vars pull as empty strings and crash the prerender build.
      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Build locally, then upload the prebuilt output. A --prebuilt deploy is
      # attributed to the TOKEN OWNER (not the commit author), which is what
      # bypasses the Hobby plan's "commit author did not have contributing
      # access" block. Building on Vercel (vercel deploy without --prebuilt)
      # would re-trigger that block.
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

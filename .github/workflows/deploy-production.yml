name: Deploy to Production (Vercel)

# Runs automatically on every push to `main`. Authenticates to Vercel as the
# project owner via the VERCEL_TOKEN secret, so deploys are NOT blocked by the
# Hobby plan's "commit author" restriction regardless of who pushed the commit.
on:
  push:
    branches: [main]

# If several commits land quickly, cancel superseded in-flight production
# deploys so only the latest commit goes live.
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache ~/.npm so the global Vercel CLI install and the dependency
          # install inside `vercel build` reuse downloaded packages.
          cache: npm

      # Cache the Next.js build cache so `vercel build` recompiles incrementally
      # instead of from scratch every run. restore-keys lets a previous build's
      # cache be reused even when source files changed.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull retrieves the project's env vars into .vercel/.env.production.local.
      # Build-time vars (NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY)
      # must be NON-sensitive in Vercel so their values come through — sensitive
      # vars pull as empty strings and crash the prerender build.
      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Build locally, then upload the prebuilt output.
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Re-author the HEAD commit as the project owner BEFORE deploying. The
      # Vercel CLI attaches the commit author to the deployment, and on the Hobby
      # plan a deploy whose commit author lacks project access is BLOCKED — this
      # fires even for --prebuilt CLI deploys (confirmed via the Vercel API:
      # collaborator-authored => BLOCKED, owner-authored => READY). Amending the
      # author to the owner keeps the commit message, SHA and branch (so Vercel
      # shows a meaningful deployment title) and only swaps the author so the
      # deploy passes. This rewrites ONLY the ephemeral CI checkout and is never
      # pushed back; your real GitHub commit and authorship are unaffected.
      - name: Re-author HEAD as project owner (avoid Hobby commit-author block)
        run: |
          git -c user.name="Escento" -c user.email="escentohq@gmail.com" \
            commit --amend --no-edit --reset-author

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployed to $url"

  smoke:
    name: Read-only smoke (production URL)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run smoke against production
        env:
          # Target the PUBLIC production alias, not the per-deployment URL the CLI
          # returns. Vercel Deployment Protection guards generated deployment URLs
          # (HTTP 401), but the production alias is public, so smoke needs no
          # bypass secret here. Override the alias with the PRODUCTION_URL repo
          # variable if it differs. `vercel deploy --prod` promotes the alias
          # before returning, so it already points at this build.
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL || 'https://escento.vercel.app' }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7

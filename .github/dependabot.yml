version: 2

# Next 16 and the Supabase SDKs move fast and are exactly where a silent
# breakage arrives. Updates are grouped so a week's worth is one PR to review,
# not fifteen — and majors are separated because they are the ones that need
# real reading.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
      development-minor:
        dependency-type: development
        update-types: [minor, patch]
      majors:
        update-types: [major]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
